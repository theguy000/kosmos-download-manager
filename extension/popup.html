<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KDM Integration Module</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 240px;
      background-color: #121214;
      color: #e4e4e7;
      padding: 14px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #27272a;
    }
    .header img {
      width: 22px;
      height: 22px;
    }
    .header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #f4f4f5;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .row:last-of-type {
      margin-bottom: 0;
    }
    .label {
      color: #a1a1aa;
      font-size: 12px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-badge.connected {
      background-color: #064e3b;
      color: #34d399;
    }
    .status-badge.disconnected {
      background-color: #450a0a;
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="KDM Logo">
    <h1>KDM Integration Module</h1>
  </div>

  <div class="row">
    <span class="label">App Status</span>
    <span id="status-badge" class="status-badge disconnected">Checking...</span>
  </div>

  <div class="row">
    <label for="intercept-toggle" class="label">Intercept Downloads</label>
    <input type="checkbox" id="intercept-toggle" checked>
  </div>

  <script src="popup.js"></script>
</body>
</html>
